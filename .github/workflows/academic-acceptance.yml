name: Academic acceptance (Flutter)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit SHA or ref of Joao-23-Santos/GarageHUB to validate
        required: true
        type: string
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: academic
      - uses: actions/checkout@v4
        with:
          repository: Joao-23-Santos/GarageHUB
          ref: ${{ inputs.source_ref }}
          path: app
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'
          channel: stable
          cache: true
      - name: Record exact source revision
        working-directory: app
        run: git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter analyze --no-pub
        working-directory: app
      - name: Execute functional acceptance scenarios
        shell: pwsh
        working-directory: app
        run: '& ../academic/scripts/academic_acceptance.ps1'
      - run: flutter test --coverage
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: app/coverage
